<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPN Gate SSTP Nodes</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 24px;
      background: #0b1020;
      color: #e6edf7;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 12px;
    }
    .meta {
      color: #9fb3c8;
      margin-bottom: 16px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111827;
      border: 1px solid #243244;
      border-radius: 10px;
      padding: 16px;
      color: #dfe8f5;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>VPN Gate SSTP 节点</h1>
    <div class="meta">自动生成于 GitHub Pages / data.json</div>
    <pre id="out">加载中...</pre>
  </div>

  <script>
    fetch('data.json')
      .then(r => r.json())
      .then(d => {
        document.getElementById('out').textContent = JSON.stringify(d, null, 2);
      })
      .catch(err => {
        document.getElementById('out').textContent = '加载失败: ' + err;
      });
  </script>
</body>
</html>
